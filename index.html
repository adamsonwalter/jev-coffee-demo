<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jev Coffee</title>

<meta name="apple-mobile-web-app-title" content="Jev Coffee">
<meta name="theme-color" content="#1a0c06">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Speak it. Jev fills it in live.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">

<link rel="stylesheet" href="/styles.css">

</head>
<body>
<div class="wrap">
  <nav class="tabs" id="tabs" aria-label="Demos"></nav>

  <header>
    <h1 id="title">Jev <span>Coffee</span></h1>
    <div class="hright">
      <div class="engine" id="engine"><i></i><span id="engineTxt">ready</span></div>
      <a class="iconbtn" id="storiesBtn" href="#stories" aria-label="What is this for? Stories for your trade">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H10l-5 4v-4H4z"/><path d="M8 9h8M8 12h5"/></svg>
      </a>
    </div>
  </header>

  <section class="ticket" aria-live="polite">
    <div id="rows"></div>
    <div id="banner"></div>
    <div class="risks" id="risks"></div>
    <div id="extra"></div>
    <div class="demorow"><button id="demoBtn" class="demobtn" hidden aria-label="Watch the demo video"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1l7 4-7 4z"/></svg>Demo</button></div>
  </section>

  <div class="say idle" id="say"></div>
  <div class="under" id="under"></div>

  <div class="mic-wrap">
    <button id="mic" aria-label="Start or stop listening">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.94V22h2v-3.06A8 8 0 0 0 20 11h-2z"/></svg>
    </button>
    <div class="mic-hint" id="micHint">Tap to talk</div>
  </div>

  <div class="try" id="try"></div>
  <div class="linkrow"><button class="modelink" id="modeBtn">Backend ›</button><span class="ver" id="ver"></span></div>

  <div class="actions">
    <button id="clear">Clear</button>
    <button id="confirm" disabled>Confirm</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<main id="backend" hidden></main>
<div id="stories" hidden></div>
<div id="player" hidden>
  <button id="playerClose" aria-label="Close video">×</button>
  <video id="playerVideo" controls playsinline preload="none"></video>
</div>
<div id="bounce" hidden>
  <h2>Open in Safari to talk</h2>
  <p>This icon opened the app without Safari, and iPhone blocks the microphone there.</p>
  <button id="bounceBtn">Open in Safari</button>
  <small>If nothing happens: delete this icon, open the page in Safari, and use Share › Add to Home Screen again. The new icon opens straight into Safari.</small>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
