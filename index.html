<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jev Coffee</title>

<meta name="apple-mobile-web-app-title" content="Jev Coffee">
<meta name="theme-color" content="#1a0c06">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Speak it. Jev fills it in live.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">

<style>
  :root {
    --bg: #1a0c06; --bg2: #2a140a; --panel: #34190d; --line: #5a3322;
    --cream: #faeed6; --amber: #ffb040; --amber-soft: #ffd88a; --ink: #f3e3c6; --dim: #c9a98a;
    --ok: #8fd694; --warn: #ffc65c; --out: #ff8a78;
    --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body {
    font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", "Trebuchet MS", sans-serif;
    color: var(--ink);
    background: radial-gradient(120% 70% at 50% 0%, #4a2412 0%, var(--bg) 62%); background-attachment: fixed;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none;
    padding: calc(var(--sat) + 12px) 18px calc(var(--sab) + 16px);
    display: flex; flex-direction: column; min-height: 100%;
  }
  .wrap { width: 100%; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; flex: 1; gap: 14px; }

  .tabs { display: flex; gap: 4px; padding: 4px; background: var(--bg2); border: 1px solid var(--line); border-radius: 16px; }
  .tab { flex: 1; border: 0; background: transparent; color: var(--dim); font: 600 14px ui-rounded, sans-serif; padding: 10px 4px; border-radius: 12px; white-space: nowrap; transition: background .2s, color .2s; }
  .tab.on { background: var(--cream); color: #1a0c06; }

  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font: 600 26px/1 ui-serif, "New York", Georgia, serif; margin: 0; color: var(--cream); letter-spacing: .2px; }
  h1 span { color: var(--amber); font-style: italic; }
  .engine { font-size: 12px; padding: 6px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .engine i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); display: block; }
  .engine.jev { color: var(--cream); border-color: #7a5230; }
  .engine.jev i { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .engine.busy i { background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: pulse .7s infinite alternate; }
  .engine.off i { background: var(--out); }
  @keyframes pulse { to { opacity: .25; } }

  .ticket { background: linear-gradient(180deg, var(--panel), var(--bg2)); border: 1px solid var(--line); border-radius: 22px; padding: 4px 18px 14px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 11px 0; border-bottom: 1px dashed var(--line); gap: 12px; }
  .row label { font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
  .row .v { font: 600 21px/1.15 ui-serif, "New York", Georgia, serif; color: var(--cream); text-align: right; transition: color .25s; }
  .row .v.empty { color: #7b5a45; font-weight: 400; }
  .row .v.flash { color: var(--amber); }
  .row .v small { display: block; font: 12px ui-rounded, sans-serif; color: var(--warn); margin-top: 2px; }
  .banner { margin: 12px 0 2px; padding: 12px 14px; border-radius: 14px; background: rgba(255,138,120,.16); border: 1px solid var(--out); color: #ffd3cb; }
  .banner b { display: block; font-size: 16px; color: var(--out); margin-bottom: 2px; }
  .banner span { font-size: 14px; }
  .risks { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; }
  .risk { font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 99px; background: rgba(255,198,92,.14); color: var(--warn); border: 1px solid rgba(255,198,92,.35); }
  .risk.out { background: rgba(255,138,120,.14); color: var(--out); border-color: rgba(255,138,120,.4); }
  .risk.ok { background: rgba(143,214,148,.12); color: var(--ok); border-color: rgba(143,214,148,.35); }
  .extra { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .extra .big { font: 600 28px/1.1 ui-serif, Georgia, serif; color: var(--amber-soft); }
  .extra .small { font-size: 13px; color: var(--dim); margin-top: 4px; line-height: 1.4; }
  .extra .note { font-size: 12px; color: var(--dim); margin-top: 8px; font-style: italic; }
  .score { display: flex; align-items: center; gap: 16px; }
  .ring { --p: 0; width: 76px; height: 76px; border-radius: 50%; background: conic-gradient(var(--c, var(--amber)) calc(var(--p) * 1%), #4a2e20 0); display: grid; place-items: center; flex: none; transition: background .3s; }
  .ring b { width: 58px; height: 58px; border-radius: 50%; background: var(--bg2); display: grid; place-items: center; font: 700 22px ui-rounded, sans-serif; color: var(--cream); }
  .score .t { font: 600 22px ui-serif, Georgia, serif; color: var(--cream); }
  .score .s { font-size: 13px; color: var(--dim); }

  .say { text-align: center; min-height: 56px; display: flex; align-items: center; justify-content: center; padding: 0 6px; font: italic 18px/1.35 ui-serif, Georgia, serif; color: var(--amber-soft); }
  .say.idle { color: var(--dim); font-size: 16px; }
  .say.err { color: var(--out); font-style: normal; font-size: 15px; font-family: ui-rounded, sans-serif; }

  .mic-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #mic { position: relative; width: 112px; height: 112px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; background: radial-gradient(circle at 35% 28%, #ffd88a, var(--amber) 55%, #d98615); box-shadow: 0 10px 30px rgba(255,176,64,.3), inset 0 -4px 10px rgba(120,60,0,.35); display: grid; place-items: center; touch-action: manipulation; transition: transform .12s; }
  #mic:active { transform: scale(.94); }
  #mic svg { width: 46px; height: 46px; fill: #2a140a; }
  #mic.on { background: radial-gradient(circle at 35% 28%, #ffb09f, #f0604a 60%, #c23a28); animation: ring 1.4s infinite; }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(240,96,74,.55); } 70%, 100% { box-shadow: 0 0 0 26px rgba(240,96,74,0); } }
  .mic-hint { font-size: 13px; color: var(--dim); }

  .try { text-align: center; font-size: 14px; line-height: 1.4; color: var(--dim); padding: 0 8px; }
  .try b { display: block; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--amber-soft); margin-bottom: 4px; font-weight: 600; }
  .try i { font: italic 16px/1.4 ui-serif, Georgia, serif; color: var(--ink); }

  .actions { display: flex; gap: 10px; margin-top: auto; }
  #confirm { flex: 1; border: 0; border-radius: 16px; padding: 17px; font: 700 18px ui-rounded, sans-serif; color: #1a0c06; background: var(--cream); }
  #confirm.danger { background: var(--out); }
  #confirm:disabled { background: #4a2e20; color: #8b6a54; }
  #clear { border: 1px solid var(--line); background: transparent; color: var(--dim); border-radius: 16px; padding: 0 18px; font: 600 15px ui-rounded, sans-serif; }

  .toast { position: fixed; left: 50%; bottom: calc(var(--sab) + 90px); transform: translate(-50%, 20px); background: var(--cream); color: #1a0c06; padding: 12px 18px; border-radius: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: .25s; max-width: 86vw; text-align: center; z-index: 50; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="wrap">
  <nav class="tabs" id="tabs" aria-label="Demos"></nav>

  <header>
    <h1 id="title">Jev <span>Coffee</span></h1>
    <div class="engine" id="engine"><i></i><span id="engineTxt">ready</span></div>
  </header>

  <section class="ticket" aria-live="polite">
    <div id="rows"></div>
    <div id="banner"></div>
    <div class="risks" id="risks"></div>
    <div id="extra"></div>
  </section>

  <div class="say idle" id="say"></div>

  <div class="mic-wrap">
    <button id="mic" aria-label="Start or stop listening">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.94V22h2v-3.06A8 8 0 0 0 20 11h-2z"/></svg>
    </button>
    <div class="mic-hint" id="micHint">Tap to talk</div>
  </div>

  <div class="try" id="try"></div>

  <div class="actions">
    <button id="clear">Clear</button>
    <button id="confirm" disabled>Confirm</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="/demos.js"></script>
<script src="/steve.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const sayEl = $('say'), micBtn = $('mic'), micHint = $('micHint'), risksEl = $('risks'), rowsEl = $('rows');
const confirmBtn = $('confirm'), engineEl = $('engine'), engineTxt = $('engineTxt');

const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const noVoice = () => !SR || (isIOS && standalone);

let demo = DEMOS[0], seq = 0, ctl = null, debounce = null, jevDownAt = 0, lastRender = null;

function say(text, cls) { sayEl.textContent = text; sayEl.className = 'say' + (cls ? ' ' + cls : ''); }
function toast(t) { const n = $('toast'); n.textContent = t; n.classList.add('show'); setTimeout(() => n.classList.remove('show'), 2400); }
function setEngine(kind, txt) { engineEl.className = 'engine ' + kind; engineTxt.textContent = txt; }

// ---------- tabs ----------
function buildTabs() {
  $('tabs').innerHTML = '';
  DEMOS.forEach((d) => { const b = document.createElement('button'); b.className = 'tab'; b.textContent = d.tab; b.dataset.id = d.id; b.onclick = () => select(d.id); $('tabs').appendChild(b); });
}
function select(id) {
  stopListening(); seq++; clearTimeout(debounce); ctl && ctl.abort();
  demo = DEMOS.find((d) => d.id === id) || DEMOS[0];
  try { history.replaceState(null, '', demo.id === 'coffee' ? location.pathname : '#' + demo.id); } catch (_) {}
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.id === demo.id));
  $('title').innerHTML = '';
  $('title').append(demo.title[0] + ' ', Object.assign(document.createElement('span'), { textContent: demo.title.slice(1).join(' ') }));
  document.title = demo.id === 'coffee' ? 'Jev Coffee' : 'Jev · ' + demo.tab;
  rowsEl.innerHTML = '';
  demo.labels.forEach((l) => { const r = document.createElement('div'); r.className = 'row'; r.innerHTML = '<label></label><div class="v empty">—</div>'; r.firstChild.textContent = l; rowsEl.appendChild(r); });
  $('try').innerHTML = '<b>Try saying</b><i></i>'; $('try').lastChild.textContent = '“' + demo.chips[0] + '”';
  resetOutput(); setEngine('', 'ready');
  if (window.Steve) Steve.reset();
}
function resetOutput() {
  rowsEl.querySelectorAll('.v').forEach((n) => { n.className = 'v empty'; n.textContent = '—'; });
  risksEl.innerHTML = ''; $('banner').innerHTML = ''; $('extra').innerHTML = '';
  confirmBtn.disabled = true; confirmBtn.className = ''; confirmBtn.textContent = demo.confirm; lastRender = null;
  say(demo.say, 'idle');
}

// ---------- on-device fallback (coffee only) ----------
function localCoffee(text) {
  const t = ' ' + text.toLowerCase() + ' ', has = (...a) => a.some((w) => t.includes(w)), f = {};
  const Y = { value: 'yes' };
  for (const [k, n] of [['flat white', 'Flat White'], ['long black', 'Long Black'], ['latte', 'Latte'], ['cappuccino', 'Cappuccino'], [' cap ', 'Cappuccino'], ['espresso', 'Espresso'], ['short black', 'Espresso'], ['americano', 'Americano'], ['mocha', 'Mocha']]) if (t.includes(k)) { f.drink = { value: n }; break; }
  f.size = { value: has('large', 'big', 'grande') ? 'Large' : has('medium', 'regular') ? 'Medium' : has('small', 'short') ? 'Small' : 'Unspecified' };
  f.milk = { value: has('oat') ? 'Oat' : has('almond') ? 'Almond' : has('soy') ? 'Soy' : has('skim', 'low fat') ? 'Skim' : has('full cream', 'dairy') ? 'Full cream' : has('no milk', 'black') ? 'None' : 'Unspecified' };
  if (has('extra shot', 'double shot')) f.extra_shot = Y; if (has('croissant')) f.croissant = Y; if (has('muffin')) f.muffin = Y; if (has('syrup', 'vanilla', 'caramel')) f.syrup = Y;
  return f;
}

async function interpret(text, mySeq) {
  if (Date.now() - jevDownAt > 15000) {
    setEngine('jev busy', 'Jev…');
    ctl && ctl.abort(); ctl = new AbortController();
    const t0 = performance.now();
    try {
      const r = await fetch('/api/order', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ demo: demo.id, transcript: text }), signal: ctl.signal });
      if (!r.ok) throw new Error('status ' + r.status);
      const d = await r.json();
      if (mySeq !== seq) return;
      setEngine('jev', 'Jev · ' + Math.round(performance.now() - t0) + ' ms');
      return d.fields;
    } catch (e) {
      if (e.name === 'AbortError') return;
      jevDownAt = Date.now();
    }
  }
  if (mySeq !== seq) return;
  if (demo.id === 'coffee') { setEngine('', 'on-device'); return localCoffee(text); }
  setEngine('off', 'Jev offline');
  say('Jev can’t be reached right now. Try again in a moment.', 'err');
}

// ---------- render ----------
function render(f) {
  const out = demo.render(f);
  if (!out.rows.some((r) => r && r[0]) && !(out.flags || []).length) out.flags = [{ m: 'Heard you, but no order details yet. Keep talking.', s: 'warn' }];
  lastRender = out;
  [...rowsEl.children].forEach((row, i) => {
    const n = row.querySelector('.v'), [val, lowConf] = out.rows[i] || [];
    const text = val || '—', base = n.firstChild && n.firstChild.nodeType === 3 ? n.firstChild.textContent : n.textContent;
    n.classList.toggle('empty', !val);
    if (base !== text) { n.textContent = text; n.classList.add('flash'); setTimeout(() => n.classList.remove('flash'), 450); }
    const old = n.querySelector('small'); if (old) old.remove();
    if (val && lowConf) { const s = document.createElement('small'); s.textContent = 'not sure — check'; n.appendChild(s); }
  });
  const b = $('banner'); b.innerHTML = '';
  if (out.banner) { const d = document.createElement('div'); d.className = 'banner'; d.innerHTML = '<b></b><span></span>'; d.firstChild.textContent = out.banner.title; d.lastChild.textContent = out.banner.body; b.appendChild(d); }
  risksEl.innerHTML = '';
  (out.flags || []).forEach((r) => { const s = document.createElement('span'); s.className = 'risk ' + r.s; s.textContent = r.m; risksEl.appendChild(s); });
  const ex = $('extra'); ex.innerHTML = '';
  if (out.extra) {
    const d = document.createElement('div'); d.className = 'extra';
    if (out.extra.kind === 'range') {
      d.innerHTML = '<div class="big"></div><div class="small"></div><div class="note"></div>';
      d.children[0].textContent = out.extra.big; d.children[1].innerHTML = ''; out.extra.small.forEach((t) => { const p = document.createElement('div'); p.textContent = t; d.children[1].appendChild(p); }); d.children[2].textContent = out.extra.note;
    } else if (out.extra.kind === 'score') {
      const c = out.extra.band === 'Hot' ? 'var(--ok)' : out.extra.band === 'Warm' ? 'var(--amber)' : 'var(--out)';
      d.innerHTML = '<div class="score"><div class="ring"><b></b></div><div><div class="t"></div><div class="s">Deal score, computed from Jev’s answers</div></div></div>';
      const ring = d.querySelector('.ring'); ring.style.setProperty('--c', c); ring.style.setProperty('--p', out.extra.score); ring.firstChild.textContent = out.extra.score; d.querySelector('.t').textContent = out.extra.band + ' deal';
    } else { d.innerHTML = '<div class="note"></div>'; d.firstChild.textContent = out.extra.note; }
    ex.appendChild(d);
  }
  confirmBtn.disabled = !out.ok; confirmBtn.textContent = out.confirm || demo.confirm; confirmBtn.classList.toggle('danger', !!out.danger);
}

async function handleText(text) {
  const mySeq = ++seq;
  const f = await interpret(text, mySeq);
  if (f && mySeq === seq) render(f);
}
function handleTextDebounced(text) { clearTimeout(debounce); debounce = setTimeout(() => handleText(text), 250); }
function heard(text) { if (window.Steve) Steve.check(text); }

// ---------- speech (Safari / Chrome) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, finalText = '', gotAny = false, noSpeechTimer = null;
function stopUI() { listening = false; micBtn.classList.remove('on'); micHint.textContent = noVoice() ? (isIOS && standalone ? 'Voice needs Safari' : 'Voice not supported here') : 'Tap to talk'; clearTimeout(noSpeechTimer); }

function startListening() {
  if (noVoice()) { say(isIOS && standalone ? 'iPhone doesn’t allow voice inside home-screen apps. Open this page in Safari to talk.' : 'This browser has no speech recognition. Use Safari or Chrome.', 'err'); return; }
  rec = new SR(); rec.lang = 'en-AU'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  finalText = ''; gotAny = false; if (window.Steve) Steve.reset();
  rec.onstart = () => { micBtn.classList.add('on'); micHint.textContent = 'Listening… tap to stop'; say('Listening…', 'idle'); };
  rec.onresult = (e) => {
    gotAny = true; let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) { const tr = e.results[i][0].transcript; if (e.results[i].isFinal) finalText = (finalText + ' ' + tr).trim(); else interim += ' ' + tr; }
    const full = (finalText + ' ' + interim).trim();
    if (full) { say('“' + full + '”'); heard(full); handleTextDebounced(full); }
  };
  rec.onerror = (e) => {
    const m = { 'not-allowed': 'Microphone blocked. iPhone: Settings › Safari › Microphone → Allow, and turn on Settings › Siri › Dictation.', 'service-not-allowed': 'Dictation is off. Turn on Settings › General › Keyboard › Enable Dictation.', 'audio-capture': 'No microphone found.', 'network': 'Speech service unreachable. Check your connection.' }[e.error];
    if (m) { say(m, 'err'); listening = false; }
  };
  rec.onend = () => {
    if (listening) { try { rec.start(); return; } catch (_) {} }
    stopUI();
    if (!gotAny && !sayEl.classList.contains('err')) say('Didn’t catch that. Tap and try again.', 'err');
  };
  listening = true;
  try { rec.start(); } catch (err) { stopUI(); say('Couldn’t start the mic: ' + err.message, 'err'); return; }
  noSpeechTimer = setTimeout(() => { if (listening && !gotAny) say('Listening… nothing heard yet. Speak closer to the phone.', 'idle'); }, 6000);
}
function stopListening() { listening = false; try { rec && rec.stop(); } catch (_) {} stopUI(); }
micBtn.addEventListener('click', () => (listening ? stopListening() : startListening()));

$('clear').addEventListener('click', () => { stopListening(); seq++; clearTimeout(debounce); ctl && ctl.abort(); resetOutput(); setEngine('', 'ready'); if (window.Steve) Steve.reset(); });
confirmBtn.addEventListener('click', () => {
  if (!lastRender) return;
  if (navigator.vibrate) navigator.vibrate(40);
  const t = lastRender.toast; toast(t || 'Done'); $('clear').click();
});

// ---------- boot ----------
buildTabs();
select((location.hash || '').slice(1) || 'coffee');
stopUI();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
</html>
